server {
    listen 80;
    server_name cisco-vai.vnudge.com;

    root /var/www/ai-soc-assistant/frontend/dist;
    index index.html;

    access_log /var/log/nginx/ai-soc-assistant.access.log;
    error_log  /var/log/nginx/ai-soc-assistant.error.log;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Architecture docs are hand-edited static HTML republished in place
    # (frontend `prebuild` copies docs/architecture/details.html into dist/docs/).
    # Without an explicit Cache-Control, browsers apply heuristic freshness from
    # Last-Modified and keep serving a stale page for hours after a redeploy.
    # ETag is already sent, so this costs one cheap 304 per load, not a re-download.
    location /docs/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }

    # Live /chat synthesis can exceed 120s on a single-slot local model. Keep this
    # above application live-synthesis timeout (120s) and below harness client timeout
    # (300s). /api/llm/ask uses 240s for the same reason.
    location /api/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8010/health;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\. {
        deny all;
    }
}
