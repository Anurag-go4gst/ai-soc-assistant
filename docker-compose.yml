services:
  # Production access is through Nginx only. Direct ports are bound to localhost.
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8010:8010"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app:/workspace
    volumes:
      - ./backend:/app
      - .:/workspace:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "127.0.0.1:3010:3010"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3010"

  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: ai_soc_assistant
      POSTGRES_USER: ai_soc
      POSTGRES_PASSWORD: ai_soc_dev_password
    volumes:
      - ai_soc_postgres_data:/var/lib/postgresql/data

volumes:
  ai_soc_postgres_data:
