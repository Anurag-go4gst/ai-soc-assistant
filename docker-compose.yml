services:
  # Production access is through Nginx only. Direct ports are bound to localhost.
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8010:8010"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app:/workspace
    # Reach the host-bound llama-server (127.0.0.1:8081 on the VPS) from inside
    # the container via host.docker.internal. Required for AI_SOC_LLM local mode.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - .:/workspace:ro
      # Shared LLM-control queue: the backend writes control-request sentinels here;
      # a HOST watcher (scripts/llm_control_watcher.py) reads them and runs systemctl.
      # The backend gets NO host systemd/docker-socket access. Set
      # AI_SOC_LLM_CONTROL_DIR=/var/lib/ai-soc/llm-control in .env to enable.
      - ./.llm-control:/var/lib/ai-soc/llm-control
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "127.0.0.1:3010:3010"
    volumes:
      - ./frontend:/app
      - ./docs:/docs:ro
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3010"

  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: ai_soc_assistant
      POSTGRES_USER: ai_soc
      POSTGRES_PASSWORD: ai_soc_dev_password
    volumes:
      - ai_soc_postgres_data:/var/lib/postgresql/data

volumes:
  ai_soc_postgres_data:
