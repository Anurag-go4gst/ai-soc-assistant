# Disposable PostgreSQL for canonical outcome invariant integration tests.
# Port 5544 — never use production 5434 or production data volumes.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ai_soc_invariant
      POSTGRES_PASSWORD: ai_soc_invariant_dev
      POSTGRES_DB: ai_soc_invariant
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - canonical_invariant_pgdata:/var/lib/postgresql/data

volumes:
  canonical_invariant_pgdata:
